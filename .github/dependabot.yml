# Weekly version updates, one grouped PR per ecosystem. PR titles are Conventional
# Commits because PRs are squash-merged with the title as the commit. A merged PR releases
# ark-cli when its description states `Release: X.Y.Z`; auto-merge.yml writes that line from
# the title (release-version.py): `deps:` and `build:` release (the image recipe is embedded
# in ark-cli), `ci:` and `chore:` don't. Security updates (repository setting) open PRs as soon as an alert appears.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/app/ark-cli", "/app/ark-web", "/app/pkg/ark"]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
      # Security fixes get the same `deps:` title, so merging them releases ark-cli.
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # base.dockerfile's pinned build image is an ARG, which Dependabot can't update;
  # it is bumped deliberately, and the monthly base refresh picks up Ubuntu updates.
  - package-ecosystem: docker
    directories: ["/app/ark-web", "/container/files"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Stay on the Ubuntu LTS (24.04); only its digest moves. Non-LTS releases are short-lived.
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
      include: scope
