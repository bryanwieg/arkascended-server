# Hourly: keep automated update PRs current and merge one whose checks all passed, so
# nobody has to watch them.
# - Bot PRs: Dependabot (dependabot/*, authored by Dependabot), GE-Proton
#   (chore/proton-update-*), Go (chore/go-update-*) and the base refresh
#   (chore/base-refresh-*), all with their head in this repository. Other PRs on those
#   branches are named in the summary and left alone.
# - Each bot PR's `Release:` line is kept matching its title and the latest cli-v* tag
#   (release-version.py); a PR behind main is updated through the update-branch API. Both
#   start the checks again (pushes and edits made with GITHUB_TOKEN trigger nothing, but
#   workflow_dispatch does). A chore/* PR whose branch can't be updated is closed and opened
#   again from main by its update workflow.
# - Merged when the newest runs of ruff, lint, test, unit, smoke and version passed or
#   skipped and nothing failed; one merge per run, so each merge releases on its own.
#   A failed check, checks missing after a day, or a passing PR still unmergeable after
#   3 days opens one issue per PR, which is the only thing to act on. Issues close
#   themselves once their PR is merged or closed.
# Merges made with GITHUB_TOKEN don't trigger push workflows, so this starts image.yml
# (publishes a changed base image) after a merge and release.yml (tags and builds the
# release) on every run, which retries a missed or failed release each hour.
name: Auto-merge updates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write # start the checks, the update workflows, image.yml and release.yml
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cli-v* tags for release-version.py latest
          fetch-tags: true
      - name: Update and merge passing bot PRs, report failing ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          label="automated-update"
          gh label create "$label" --color FBCA04 --description "Automated update needing attention" >/dev/null 2>&1 || true
          latest_tag="$(python3 .github/release-version.py latest)"
          body="$RUNNER_TEMP/body.md"
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          report_failure() { # $1 PR number, $2 PR title, $3 PR URL, $4 reason
            local title="Automated update failed: $2 (#$1)"
            local open
            open="$(gh issue list --state open --label "$label" --json title \
              --jq "map(select(.title == \"$title\")) | length")"
            if [[ "$open" == 0 ]]; then
              gh issue create --label "$label" --title "$title" \
                --body "$3 was not merged: $4. Fix or close the PR, then close this issue."
              summary "Reported #$1: $4"
            fi
          }

          dispatch() { # $1 branch, then the workflows to start on it
            local branch="$1" workflow
            shift
            for workflow in "$@"; do
              gh workflow run "$workflow" --ref "$branch" || summary "Could not start $workflow on $branch"
            done
          }

          release_current() { # $1 PR number, $2 title; true when $body's Release: line matches, else rewrites it
            local expected stated
            expected="$(python3 .github/release-version.py next --title "$2" --latest-tag "$latest_tag")"
            stated="$(python3 .github/release-version.py parse --body-file "$body" 2>/dev/null)" || stated="invalid"
            [[ "$stated" != "$expected" ]] || return 0
            { grep -Ev '^[[:space:]]*Release:' "$body" || true; [[ -z "$expected" ]] || printf '\nRelease: %s\n' "$expected"; } > "$body.new"
            if gh pr edit "$1" --body-file "$body.new"; then
              summary "Set #$1's Release: line to ${expected:-none}"
            else
              summary "Could not edit #$1's Release: line"
            fi
            return 1
          }

          recheck_version() { # $1 branch, $2 head sha: re-run its pull_request version run, else dispatch one
            local run
            # GitHub keeps judging the PR by its pull_request run, so a second (dispatched) run can't replace a failed one.
            run="$(gh run list --workflow version.yml --event pull_request --commit "$2" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')" || run=""
            if [[ -n "$run" ]]; then
              gh run rerun "$run" || summary "Could not re-run version on $1"
            else
              dispatch "$1" version.yml
            fi
          }

          older_than() { # $1 created timestamp, $2 days
            (( $(date +%s) - $(date -d "$1" +%s) > $2 * 86400 ))
          }

          checks=(python.yml cli.yml image.yml version.yml)
          merged=0
          while IFS=$'\t' read -r number branch sha created url state trusted title; do
            case "$branch" in
              dependabot/*) updater="" ;;
              chore/proton-update-*) updater=proton-update.yml ;;
              chore/go-update-*) updater=go-update.yml ;;
              chore/base-refresh-*) updater=base-refresh.yml ;;
              *) continue ;;
            esac
            if [[ "$trusted" != true ]]; then
              summary "Skipped #$number: a fork, or $branch not authored by Dependabot"
              continue
            fi
            rebase_hint=""
            [[ -n "$updater" ]] || rebase_hint=" (comment \`@dependabot rebase\` on it)"
            if ! gh pr view "$number" --json body --jq .body > "$body"; then
              summary "Skipped #$number: could not read its description"
              continue
            fi

            if [[ "$state" == BEHIND ]]; then
              if gh api -X PUT "repos/$GH_REPO/pulls/$number/update-branch" -f expected_head_sha="$sha" >/dev/null; then
                # The update is asynchronous; dispatching before the head moves would check the old commit.
                for _ in {1..12}; do
                  [[ "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" == "$sha" ]] || break
                  sleep 5
                done
                release_current "$number" "$title" || true
                dispatch "$branch" "${checks[@]}"
                summary "Updated #$number with main; checks started"
              elif [[ -n "$updater" ]]; then
                # GITHUB_TOKEN may not push main's workflow changes into the branch: start over from main.
                if gh pr close "$number" --delete-branch \
                  --comment "Could not be updated with main; $updater opens a fresh PR."; then
                  dispatch main "$updater"
                  summary "Closed #$number (could not be updated); $updater opens it again"
                else
                  summary "Could not close #$number after a failed update; next run retries"
                fi
              elif older_than "$created" 3; then
                report_failure "$number" "$title" "$url" "it could not be updated with main for 3 days$rebase_hint"
              else
                summary "Could not update #$number with main; next run retries"
              fi
              continue
            fi

            if ! release_current "$number" "$title"; then
              recheck_version "$branch" "$sha"
              continue
            fi

            if ! runs="$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs | group_by(.name)[] | max_by(.id) | {name, status, conclusion}]')"; then
              summary "Skipped #$number: could not read its checks"
              continue
            fi
            missing="$(jq -r '["ruff", "lint", "test", "unit", "smoke", "version"] - map(.name) | join(" ")' <<<"$runs")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            failed="$(jq '[.[] | select(.conclusion != null and (.conclusion | IN("success", "skipped", "neutral") | not))] | length' <<<"$runs")"
            if (( failed > 0 )); then
              report_failure "$number" "$title" "$url" "$failed check(s) failed on $sha"
            elif (( pending > 0 )); then
              summary "Waiting for #$number ($pending check(s) running)"
            elif [[ -n "$missing" ]]; then
              # The update workflows and this one start the checks; still missing after a day means that failed.
              if older_than "$created" 1; then
                report_failure "$number" "$title" "$url" "check(s) $missing did not run on $sha"
              else
                summary "Waiting for #$number (no $missing yet)"
              fi
            elif (( merged > 0 )); then
              summary "#$number passed; one merge per run, next run merges it"
            elif gh pr merge "$number" --squash --subject "$title (#$number)" --body ""; then
              merged=1
              summary "Merged #$number: $title"
            elif older_than "$created" 3; then
              report_failure "$number" "$title" "$url" "it passed its checks but could not be merged for 3 days (conflict?)$rebase_hint"
            else
              summary "Could not merge #$number yet (conflict?); next run retries"
            fi
          done < <(gh pr list --state open --limit 100 \
            --json number,headRefName,headRefOid,createdAt,url,mergeStateStatus,isCrossRepository,author,title \
            --jq '.[] | [.number, .headRefName, .headRefOid, .createdAt, .url, .mergeStateStatus,
              ((.isCrossRepository | not) and ((.headRefName | startswith("dependabot/") | not) or .author.login == "app/dependabot")),
              .title] | @tsv')

          # Close failure issues whose PR is no longer open: merged, or closed (e.g. superseded
          # by a Dependabot group). Runs after the merges above, so it also covers those.
          gh issue list --state open --label "$label" --limit 100 --json number,title \
            --jq '.[] | [.number, (.title | capture("\\(#(?<pr>[0-9]+)\\)$").pr // "")] | @tsv' |
            while IFS=$'\t' read -r issue pr; do
              [[ -n "$pr" ]] || continue
              state="$(gh pr view "$pr" --json state --jq .state)"
              if [[ "$state" != OPEN ]]; then
                gh issue close "$issue" --comment "Resolved: #$pr is ${state,,}."
                summary "Closed #$issue (#$pr ${state,,})"
              fi
            done

          if (( merged > 0 )); then
            gh workflow run image.yml --ref main
          fi
          # Always: a merge can succeed even when gh reports an error (e.g. a 502), and
          # release.yml also finishes a release an earlier run left incomplete.
          gh workflow run release.yml --ref main
