# Monthly: bump the refresh line in container/base.dockerfile, open a PR, with its `Release:`
# line, and start the checks (python, cli, image, version) on its branch (PRs opened with
# GITHUB_TOKEN don't trigger CI, but workflow_dispatch does). auto-merge.yml merges the PR
# once they pass, which changes the base image's tag, so main rebuilds and publishes the base.
name: Base image refresh

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  actions: write # start the checks on the branch
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cli-v* tags for release-version.py latest
          fetch-tags: true
      - name: Bump the refresh line and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month="$(date -u +%Y-%m)"
          sed -i "s/^# refresh: .*/# refresh: $month/" container/base.dockerfile
          if git diff --quiet; then
            echo "Base already refreshed for $month" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/base-refresh-$month"
          title="build(container): refresh the base image ($month)"
          description="Rebuilds the base image with current Ubuntu packages. The checks run on this branch; auto-merge.yml merges it when they pass."
          # Before the push: a failure here leaves no branch without a PR.
          latest_tag="$(python3 .github/release-version.py latest)"
          release="$(python3 .github/release-version.py next --title "$title" --latest-tag "$latest_tag")"
          body="$description"
          [[ -z "$release" ]] || body+=$'\n\nRelease: '"$release"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "$title"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
          for workflow in python.yml cli.yml image.yml version.yml; do
            gh workflow run "$workflow" --ref "$branch"
          done
