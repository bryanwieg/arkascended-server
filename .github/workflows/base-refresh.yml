# Monthly: bump the refresh line in container/base.dockerfile, open a PR and start the
# image build + smoke tests on its branch (PRs opened with GITHUB_TOKEN don't trigger
# CI, but workflow_dispatch does). auto-merge.yml merges the PR once they pass, which
# changes the base image's tag, so main rebuilds and publishes the base.
name: Base image refresh

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  actions: write # start image.yml on the branch
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump the refresh line and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month="$(date -u +%Y-%m)"
          sed -i "s/^# refresh: .*/# refresh: $month/" container/base.dockerfile
          if git diff --quiet; then
            echo "Base already refreshed for $month" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/base-refresh-$month"
          title="build(container): refresh the base image ($month)"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "$title"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Rebuilds the base image with current Ubuntu packages. The image build and smoke tests run on this branch; auto-merge.yml merges it when they pass."
          gh workflow run image.yml --ref "$branch"
