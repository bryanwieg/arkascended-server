# CLI pipeline: vet, test and lint on every PR (required checks; they skip when
# no Go file changed or this content already passed); when called by
# release.yml with a cli-v* tag, only builds the release binary and attaches it
# to that GitHub release.
name: CLI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # go-update.yml starts it on its branch
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload (e.g. cli-v0.1.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  changes:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.group.outputs.work }}
      hash: ${{ steps.group.outputs.hash }}
      test-passed: ${{ steps.test.outputs.cache-hit }}
      lint-passed: ${{ steps.lint.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main and the merge base
      - id: group
        run: |
          work=$(.github/changed.sh go)
          hash=$(.github/changed.sh hash go)
          echo "work=$work" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - id: test
        uses: actions/cache/restore@v6
        with:
          path: .passed
          key: passed-test-${{ steps.group.outputs.hash }}
          lookup-only: true
      - id: lint
        uses: actions/cache/restore@v6
        with:
          path: .passed
          key: passed-lint-${{ steps.group.outputs.hash }}
          lookup-only: true

  test:
    needs: changes
    # Runs (and fails) when changes failed: a skipped required check counts as passed.
    if: ${{ !cancelled() && !inputs.tag && (needs.changes.result != 'success' || (needs.changes.outputs.work == 'true' && needs.changes.outputs.test-passed != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed" >&2
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            app/**/go.sum
      - run: go vet ./app/ark-cli/... ./app/pkg/ark/... ./app/ark-web/... ./container/...
      - run: go test ./app/ark-cli/... ./app/pkg/ark/... ./app/ark-web/... ./container/...
      - run: echo "${{ needs.changes.outputs.hash }}" > .passed
      - uses: actions/cache/save@v6
        with:
          path: .passed
          key: passed-test-${{ needs.changes.outputs.hash }}

  lint:
    needs: changes
    # Not for releases (the released commit passed on its PR). Runs (and fails) when
    # changes failed: a skipped required check counts as passed.
    if: ${{ !cancelled() && !inputs.tag && (needs.changes.result != 'success' || (needs.changes.outputs.work == 'true' && needs.changes.outputs.lint-passed != 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # only-new-issues reads the PR diff
    steps:
      - if: needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed" >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          # Manual runs (go-update.yml's branches) compare against origin/main below.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            app/**/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # shortcut: existing findings are backlog; drop this once they are fixed.
          # PRs report only new findings (from their diff); manual runs have no
          # diff, so they report findings new since origin/main.
          only-new-issues: ${{ github.event_name != 'workflow_dispatch' }}
          # go.work has no root module, so ./... matches nothing; list each module.
          args: >-
            ${{ github.event_name == 'workflow_dispatch' && '--new-from-rev=origin/main' || '' }}
            ./app/ark-cli/... ./app/pkg/ark/... ./app/ark-web/... ./container/...
      - run: echo "${{ needs.changes.outputs.hash }}" > .passed
      - uses: actions/cache/save@v6
        with:
          path: .passed
          key: passed-lint-${{ needs.changes.outputs.hash }}

  release:
    # The released commit passed test on its PR; a release run only builds.
    if: inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            app/**/go.sum
      - name: Build and upload linux/amd64 binary
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#cli-v}"
          out="ark-cli-${version}-linux-amd64"
          (cd app/ark-cli && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${GITHUB_WORKSPACE}/${out}" .)
          test "$("./${out}" --version)" = "${version}"
          sha256sum "${out}" > "${out}.sha256"
          gh release upload "${TAG}" "${out}" "${out}.sha256" --clobber
