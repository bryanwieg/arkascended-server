# Weekly: if go.dev has a newer stable Go release than go.work's `go` line (which CI's
# setup-go and local builds use), open a PR bumping it and start the CLI tests and lint
# on its branch (PRs opened with GITHUB_TOKEN don't trigger CI, but workflow_dispatch
# does). auto-merge.yml merges the PR once they pass. Dependabot covers the golang image
# in app/ark-web/Dockerfile but can't update go.work.
name: Go update

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  actions: write # start cli.yml on the branch
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open a PR for a newer Go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(curl -fsS 'https://go.dev/dl/?mode=json' | jq -r '[.[] | select(.stable)][0].version')"
          # The version comes from go.dev: accept only the go<major>.<minor>.<patch> form.
          if [[ ! "$latest" =~ ^go([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::unexpected Go version from go.dev: '$latest'"
            exit 1
          fi
          latest="${BASH_REMATCH[1]}"
          current="$(sed -n 's/^go //p' go.work)"
          newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)"
          if [[ "$latest" == "$current" || "$newest" == "$current" ]]; then
            echo "Go $current is current (latest release: $latest)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/go-update-$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; its PR is pending" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # build: releases ark-cli, so the published binary is built with the new Go.
          title="build: update Go to $latest"
          sed -i "s/^go .*/go $latest/" go.work
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "$title"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Go $current → $latest ([release notes](https://go.dev/doc/devel/release)). The CLI tests and lint run on this branch; auto-merge.yml merges it when they pass."
          gh workflow run cli.yml --ref "$branch"
