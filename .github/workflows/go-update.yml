# Weekly: if go.dev has a newer stable Go release than go.work's `go` line (which CI's
# setup-go and local builds use), open a PR bumping it, with its `Release:` line,
# opened with the bot App token so the PR checks run. auto-merge.yml merges the PR once they pass.
# Dependabot covers the golang image in app/ark-web/Dockerfile but can't update go.work.
name: Go update

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read # the App token does the writing

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The bot App's token, not GITHUB_TOKEN: its pushes, PRs and edits trigger the PR checks.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0 # cli-v* tags for release-version.py latest
          fetch-tags: true
      - name: Open a PR for a newer Go
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          latest="$(curl -fsS 'https://go.dev/dl/?mode=json' | jq -r '[.[] | select(.stable)][0].version')"
          # The version comes from go.dev: accept only the go<major>.<minor>.<patch> form.
          if [[ ! "$latest" =~ ^go([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::unexpected Go version from go.dev: '$latest'"
            exit 1
          fi
          latest="${BASH_REMATCH[1]}"
          current="$(sed -n 's/^go //p' go.work)"
          newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)"
          if [[ "$latest" == "$current" || "$newest" == "$current" ]]; then
            echo "Go $current is current (latest release: $latest)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/go-update-$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; its PR is pending" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # build: releases ark-cli, so the published binary is built with the new Go.
          title="build: update Go to $latest"
          sed -i "s/^go .*/go $latest/" go.work
          description="Go $current → $latest ([release notes](https://go.dev/doc/devel/release)). The checks run on this branch; auto-merge.yml merges it when they pass."
          # Before the push: a failure here leaves no branch without a PR.
          latest_tag="$(python3 .github/release-version.py latest)"
          release="$(python3 .github/release-version.py next --title "$title" --latest-tag "$latest_tag")"
          body="$description"
          [[ -z "$release" ]] || body+=$'\n\nRelease: '"$release"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "$title"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
