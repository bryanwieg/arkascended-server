# Container pipeline:
# - every change under container/: Python unit tests for the container scripts, plus the
#   OOM-report test (a real OOM kill in a python:3.14-slim container, no ARK image)
# - daily, manual, and pushes to main under container/: build the image from Steam's current
#   ARK build and run the smoke tests (healthy start and clean stop). No ARK image is published:
#   ark-cli builds the image on each host. The daily run is an early warning that a new ARK
#   build breaks the image. On main, a passing run publishes the ARK-free base image
#   (container/base.dockerfile) to GHCR when that tag is missing.
name: Container image

on:
  pull_request:
    paths:
      - "container/**"
      - "tests/container/unit/**"
      - "tests/container/integration/fast/test_server_oom_report.py"
      - "requirements-dev.txt"
      - ".github/build-image.sh"
      - ".github/workflows/image.yml"
  push:
    branches: [main]
    paths:
      - "container/**"
      - "tests/container/unit/**"
      - "tests/container/integration/fast/test_server_oom_report.py"
      - "requirements-dev.txt"
      - ".github/build-image.sh"
      - ".github/workflows/image.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ark-server

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pytest -m unit tests/container/unit
      # A real kernel OOM kill under a cgroup memory limit. The test needs only python3.14, so
      # pointing ARK_TEST_IMAGE at a pulled python image keeps the session from building the ARK image.
      - run: docker pull -q python:3.14-slim
      - run: pytest -rs tests/container/integration/fast/test_server_oom_report.py
        env:
          ARK_TEST_IMAGE: python:3.14-slim

  smoke:
    needs: unit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish the base image to GHCR
    timeout-minutes: 360
    concurrency:
      group: image-smoke
      cancel-in-progress: false
    steps:
      # Clear images and build cache first: leftover layers from an earlier run
      # sit next to the rebuilt ones and fill the disk. Runs before the build, so
      # a crashed run can't leave the next one short of space.
      - name: Free disk space
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [[ "$HOSTED" == "true" ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
              /usr/local/.ghcup /usr/lib/jvm /usr/share/swift /opt/google /opt/microsoft /opt/az /usr/local/julia* \
              /usr/local/share/chromium /usr/local/share/powershell /usr/lib/google-cloud-sdk
            # The containerd image store keeps each layer compressed and unpacked; the
            # ARK image does not fit the hosted disk twice, so use the classic store.
            # Not on self-hosted runners: this rewrites the host's Docker config.
            conf=/etc/docker/daemon.json
            { sudo cat "$conf" 2>/dev/null || echo '{}'; } |
              jq '.features["containerd-snapshotter"] = false' | sudo tee "$conf.new" >/dev/null
            sudo mv "$conf.new" "$conf"
            sudo systemctl restart docker
            docker info --format 'storage driver: {{.Driver}}'
          fi
          docker image prune -af
          docker builder prune -af
          df -h /
      - uses: actions/checkout@v7
        with:
          lfs: true  # restore-test fixture
      - name: Build
        id: build
        env:
          # The SteamCMD install isn't reused on a fresh runner; dropping it once the
          # server files image exists leaves room for the runtime image.
          ARK_BUILD_DELETE_CACHE: "1"
          # Docker's default seccomp profile blocks SteamCMD on GitHub-hosted runners.
          STEAMCMD_DOCKER_OPTS: --security-opt seccomp=unconfined
        run: |
          ./.github/build-image.sh | tee build.log
          # build-image.sh prints BASE_IMAGE=<ref> last.
          echo "base_image=$(tail -1 build.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      # A healthy start and clean stop (run-tests.py --suite smoke).
      - name: Prepare hosted runner for the smoke tests
        if: runner.environment == 'github-hosted'
        run: |
          # Same minimums as container-entrypoint.py's HOST_KERNEL_PARAMS.
          sudo sysctl -w vm.max_map_count=16777216 net.core.rmem_max=16777216 net.core.wmem_max=16777216 fs.file-max=1048576
          # One ARK server outgrows the runner's RAM and gets OOM-killed; swap lets it
          # finish starting. Clearing the build cache makes room for the swap file.
          docker builder prune -af
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile-ark
          sudo chmod 600 /swapfile-ark
          sudo mkswap /swapfile-ark
          sudo swapon /swapfile-ark
          free -h
          df -h /
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Smoke tests
        env:
          ARK_TEST_IMAGE: ${{ env.IMAGE_NAME }}:latest
        run: |
          pip install -r requirements-dev.txt
          python run-tests.py --suite smoke --python "$(command -v python)"
      - name: Show test results
        if: always()
        run: |
          # Run dirs are timestamp-named; older runs are kept, so take the newest.
          run_dir="$(find .tests -maxdepth 1 -name '*-suiterun' 2>/dev/null | sort | tail -1)"
          [[ -n "$run_dir" ]] || exit 0
          fence='```'
          { echo "### Smoke tests"; echo "${fence}text"; cat "$run_dir/suite.log"; echo "$fence"; } >> "$GITHUB_STEP_SUMMARY"
          # Each test's artifact dir holds its pytest report plus compose, docker
          # and framework logs; print them for every test that failed.
          grep -rlE --include=pytest.log '^result: FAILED|^== [a-z]+: failed ==' "$run_dir" |
            while read -r report; do
              dir="$(dirname "$report")"
              echo "::group::FAILED $(basename "$dir")"
              for f in "$dir"/*; do
                echo "----- $(basename "$f") (last 300 lines)"
                tail -n 300 "$f"
              done
              echo "::endgroup::"
            done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts
          path: .tests/
          include-hidden-files: true  # .tests/ is a dot-directory
          if-no-files-found: ignore
          retention-days: 14
      # After the smoke tests passed: publish the base (ARK-free) for hosts to pull.
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish base image
        if: github.ref == 'refs/heads/main'
        env:
          BASE: ${{ steps.build.outputs.base_image }}
        run: |
          if docker manifest inspect "$BASE" >/dev/null 2>&1; then
            echo "Base $BASE already published" >> "$GITHUB_STEP_SUMMARY"
          else
            docker push "$BASE"
            echo "Published $BASE" >> "$GITHUB_STEP_SUMMARY"
          fi
