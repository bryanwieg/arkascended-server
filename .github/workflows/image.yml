# Container pipeline:
# - PRs and dispatched bot branches: `unit` (Python unit tests for the container scripts and the
#   CI scripts, plus the lite tests (`-m lite`): container and CLI tests on the lite image (real
#   runtime scripts, a fake ARK server, no ARK files; tests/helpers/lite_image.py), including a
#   real OOM kill) and `smoke` (build the image from Steam's current ARK build, then a healthy
#   start and clean stop). Both report on every PR (required checks) and skip when nothing in
#   their group (.github/changed.sh) changed or this content already passed.
# - daily: `smoke` on main, the early warning that a new ARK build breaks the image; a failure
#   opens an issue. No ARK image is published: ark-cli builds the image on each host.
# - main (base.dockerfile pushes, manual, daily): `publish-base` pushes the ARK-free base image
#   (container/base.dockerfile) to GHCR when that tag is missing.
name: Container image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - "container/base.dockerfile"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: # bot branches; on main, publish-base only

permissions:
  contents: read

env:
  IMAGE_NAME: ark-server

jobs:
  changes:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      unit-work: ${{ steps.group.outputs.unit-work }}
      unit-hash: ${{ steps.group.outputs.unit-hash }}
      unit-passed: ${{ steps.unit.outputs.cache-hit }}
      smoke-work: ${{ steps.group.outputs.smoke-work }}
      smoke-hash: ${{ steps.group.outputs.smoke-hash }}
      smoke-passed: ${{ steps.smoke.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main and the merge base
      - id: group
        run: |
          for group in unit smoke; do
            work=$(.github/changed.sh "$group")
            hash=$(.github/changed.sh hash "$group")
            echo "$group-work=$work" >> "$GITHUB_OUTPUT"
            echo "$group-hash=$hash" >> "$GITHUB_OUTPUT"
          done
      - id: unit
        uses: actions/cache/restore@v6
        with:
          path: .passed
          key: passed-unit-${{ steps.group.outputs.unit-hash }}
          lookup-only: true
      - id: smoke
        uses: actions/cache/restore@v6
        with:
          path: .passed
          key: passed-smoke-${{ steps.group.outputs.smoke-hash }}
          lookup-only: true

  unit:
    needs: changes
    # Runs (and fails) when changes failed: a skipped required check counts as passed.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || (needs.changes.outputs.unit-work == 'true' && needs.changes.outputs.unit-passed != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed" >&2
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pytest -m unit tests/container/unit tests/test_ci_workflows.py tests/test_release_version.py
      # The CLI lite tests build ark-cli.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            app/**/go.sum
      # The tests build ark-cli with GOCACHE=.go-cache (tests/helpers/artifacts.py); without it
      # each run compiles from scratch (about 40 s). Keyed on the sources, so a change saves a new
      # entry and the last one is restored.
      - uses: actions/cache@v6
        with:
          path: .go-cache
          key: ark-cli-gocache-${{ runner.os }}-${{ hashFiles('go.work', 'go.work.sum', 'app/**/go.sum', 'app/**/*.go', 'container/**') }}
          restore-keys: ark-cli-gocache-${{ runner.os }}-
      # Lite tests run on a small image built from the runtime scripts and a fake ARK server, so
      # the session never builds the ARK image. Includes a real kernel OOM kill under a cgroup limit.
      # docker/ only: podman/conftest.py switches the whole session to Podman when imported.
      - run: pytest -rs -m lite tests/container/integration tests/app/ark_cli/integration/docker
      - run: echo "${{ needs.changes.outputs.unit-hash }}" > .passed
      - uses: actions/cache/save@v6
        with:
          path: .passed
          key: passed-unit-${{ needs.changes.outputs.unit-hash }}

  smoke:
    needs: [changes, unit]
    # Daily on main without unit or markers; on PRs like unit, once unit passed or skipped.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.changes.result != 'skipped' && (needs.changes.result != 'success' || (needs.changes.outputs.smoke-work == 'true' && needs.changes.outputs.smoke-passed != 'true' && (needs.unit.result == 'success' || needs.unit.result == 'skipped'))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: image-smoke-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'schedule' }}
    steps:
      - if: github.event_name != 'schedule' && needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed" >&2
          exit 1
      # Clear images and build cache first: leftover layers from an earlier run
      # sit next to the rebuilt ones and fill the disk. Runs before the build, so
      # a crashed run can't leave the next one short of space.
      - name: Free disk space
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [[ "$HOSTED" == "true" ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
              /usr/local/.ghcup /usr/lib/jvm /usr/share/swift /opt/google /opt/microsoft /opt/az /usr/local/julia* \
              /usr/local/share/chromium /usr/local/share/powershell /usr/lib/google-cloud-sdk
            # The containerd image store keeps each layer compressed and unpacked; the
            # ARK image does not fit the hosted disk twice, so use the classic store.
            # Not on self-hosted runners: this rewrites the host's Docker config.
            conf=/etc/docker/daemon.json
            { sudo cat "$conf" 2>/dev/null || echo '{}'; } |
              jq '.features["containerd-snapshotter"] = false' | sudo tee "$conf.new" >/dev/null
            sudo mv "$conf.new" "$conf"
            sudo systemctl restart docker
            docker info --format 'storage driver: {{.Driver}}'
          fi
          docker image prune -af
          docker builder prune -af
          df -h /
      - uses: actions/checkout@v7
        with:
          lfs: true  # restore-test fixture
      # build-image.sh runs container/cmd/recipe-id to tag images like ark-cli does.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - name: Build
        env:
          # The SteamCMD install isn't reused on a fresh runner; dropping it once the
          # server files are in the build context leaves room for the runtime image.
          ARK_BUILD_DELETE_CACHE: "1"
          # Docker's default seccomp profile blocks SteamCMD on GitHub-hosted runners.
          STEAMCMD_DOCKER_OPTS: --security-opt seccomp=unconfined
        run: ./.github/build-image.sh
      # A healthy start and clean stop (run-tests.py --suite smoke).
      - name: Prepare hosted runner for the smoke tests
        if: runner.environment == 'github-hosted'
        run: |
          # Same minimums as container-entrypoint.py's HOST_KERNEL_PARAMS.
          sudo sysctl -w vm.max_map_count=16777216 net.core.rmem_max=16777216 net.core.wmem_max=16777216 fs.file-max=1048576
          # One ARK server outgrows the runner's RAM and gets OOM-killed; swap lets it
          # finish starting. Clearing the build cache makes room for the swap file.
          docker builder prune -af
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile-ark
          sudo chmod 600 /swapfile-ark
          sudo mkswap /swapfile-ark
          sudo swapon /swapfile-ark
          free -h
          df -h /
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Smoke tests
        env:
          ARK_TEST_IMAGE: ${{ env.IMAGE_NAME }}:latest
        run: |
          pip install -r requirements-dev.txt
          python run-tests.py --suite smoke --python "$(command -v python)"
      - name: Show test results
        if: always()
        run: |
          # Run dirs are timestamp-named; older runs are kept, so take the newest.
          run_dir="$(find .tests -maxdepth 1 -name '*-suiterun' 2>/dev/null | sort | tail -1)"
          [[ -n "$run_dir" ]] || exit 0
          fence='```'
          { echo "### Smoke tests"; echo "${fence}text"; cat "$run_dir/suite.log"; echo "$fence"; } >> "$GITHUB_STEP_SUMMARY"
          # Each test's artifact dir holds its pytest report plus compose, docker
          # and framework logs; print them for every test that failed.
          grep -rlE --include=pytest.log '^result: FAILED|^== [a-z]+: failed ==' "$run_dir" |
            while read -r report; do
              dir="$(dirname "$report")"
              echo "::group::FAILED $(basename "$dir")"
              for f in "$dir"/*; do
                echo "----- $(basename "$f") (last 300 lines)"
                tail -n 300 "$f"
              done
              echo "::endgroup::"
            done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts
          path: .tests/
          include-hidden-files: true  # .tests/ is a dot-directory
          if-no-files-found: ignore
          retention-days: 14
      - if: github.event_name != 'schedule'
        run: echo "${{ needs.changes.outputs.smoke-hash }}" > .passed
      - if: github.event_name != 'schedule'
        uses: actions/cache/save@v6
        with:
          path: .passed
          key: passed-smoke-${{ needs.changes.outputs.smoke-hash }}

  # The base (ARK-free) for hosts to pull, tagged like build-image.sh and ark-cli do.
  publish-base:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish the base image to GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish base image
        run: |
          base="ghcr.io/bryanwieg/ark-server-base:$(sha256sum container/base.dockerfile | cut -c1-12)"
          if docker manifest inspect "$base" >/dev/null 2>&1; then
            echo "Base $base already published" >> "$GITHUB_STEP_SUMMARY"
          else
            docker build -f container/base.dockerfile -t "$base" container
            docker push "$base"
            echo "Published $base" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A failing daily smoke run on main opens an issue, so nobody has
  # to watch the runs: it is the early warning that a new ARK build breaks the image.
  alert:
    needs: smoke
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Image smoke test failing on main"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The image build or smoke tests failed on \`main\`: $RUN_URL

          Hosts keep their current image until this is fixed. Close this issue once a run passes."
          fi
