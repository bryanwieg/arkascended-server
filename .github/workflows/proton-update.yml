# Weekly: if GloriousEggroll/proton-ge-custom has a newer GE-Proton release than
# container/base.dockerfile's PROTON_VERSION, open a PR bumping it, with its `Release:` line,
# opened with the bot App token so the PR checks run. auto-merge.yml merges the PR
# once they pass.
name: GE-Proton update

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read # the App token does the writing

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The bot App's token, not GITHUB_TOKEN: its pushes, PRs and edits trigger the PR checks.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0 # cli-v* tags for release-version.py latest
          fetch-tags: true
      - name: Open a PR for a newer GE-Proton
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          file=container/base.dockerfile
          tag="$(gh api repos/GloriousEggroll/proton-ge-custom/releases/latest --jq .tag_name)"
          # The tag comes from another repository: accept only the GE-Proton<major>-<minor> form.
          if [[ ! "$tag" =~ ^GE-Proton([0-9]+-[0-9]+)$ ]]; then
            echo "::error::unexpected GE-Proton release tag: '$tag'"
            exit 1
          fi
          latest="${BASH_REMATCH[1]}"
          current="$(sed -n 's/^ARG PROTON_VERSION=//p' "$file")"
          newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)"
          if [[ "$latest" == "$current" || "$newest" == "$current" ]]; then
            echo "GE-Proton $current is current (latest release: $latest)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/proton-update-$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; its PR is pending" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="build(container): update GE-Proton to $latest"
          sed -i "s/^ARG PROTON_VERSION=.*/ARG PROTON_VERSION=$latest/" "$file"
          description="GE-Proton $current → $latest ([release](https://github.com/GloriousEggroll/proton-ge-custom/releases/tag/$tag)). The checks run on this branch; auto-merge.yml merges it when they pass."
          # Before the push: a failure here leaves no branch without a PR.
          latest_tag="$(python3 .github/release-version.py latest)"
          release="$(python3 .github/release-version.py next --title "$title" --latest-tag "$latest_tag")"
          body="$description"
          [[ -z "$release" ]] || body+=$'\n\nRelease: '"$release"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "$title"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "$body"
