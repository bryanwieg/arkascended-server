# Python lint: ruff check + format check (ruff.toml) for container scripts,
# tests and run-tests.py.
name: Python lint

on:
  pull_request:
    paths:
      - "**.py"
      - "ruff.toml"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "ruff.toml"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.17.5
          args: check --output-format github
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.17.5
          args: format --check --diff
