# Keeps the release PR open (release-please) and, when it merges, tags the release
# and builds and uploads the ark-cli binary. One release covers app/ and container/:
# the image recipe is embedded in ark-cli, so recipe changes ship only in a CLI release.
# Reusable-workflow calls are needed because tags and releases created with
# GITHUB_TOKEN do not trigger other workflows. workflow_dispatch: auto-merge.yml
# starts it after merging, since merges by GITHUB_TOKEN don't trigger the push event.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      cli_tag: ${{ steps.rp.outputs.release_created == 'true' && steps.rp.outputs.tag_name || '' }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  cli:
    needs: release-please
    if: needs.release-please.outputs.cli_tag != ''
    permissions:
      contents: write
      pull-requests: read # cli.yml's lint job (golangci-lint only-new-issues)
    uses: ./.github/workflows/cli.yml
    with:
      tag: ${{ needs.release-please.outputs.cli_tag }}
