services:
  asa-server-1:
    build:
      context: .
      dockerfile: container/dockerfile
    image: ark-server:latest
    container_name: ark-server-1
    restart: "no"
    init: true
    stop_grace_period: 8m
    stop_signal: SIGTERM
    environment:
      - TZ=America/Los_Angeles
      - MAP_NAME=TheIsland_WP
      - SESSION_NAME=Server_1_name
      - SERVER_ADMIN_PASSWORD=MyPassword
      - SERVER_PASSWORD=
      - ASA_PORT=27015
      - NoBattlEye=true
      - ARK_SKIP_RAM_CHECK=1
    ports:
      - "27015:27015/udp"
      - "127.0.0.1:27020:27020/tcp"
    labels:
      ark.port.asa: "27015"
      ark.port.rcon: "27020"
    mem_reservation: 12G
    volumes:
      - "ark-server-1-saved:/home/ark-user/ark-server/ShooterGame/Saved"
      - "ark-cluster-1:/home/ark-user/ark-server/ShooterGame/Saved/clusters"
  # Scheduler service (backups on a schedule, health monitor on :8099), the same as `ark-cli enable scheduler`
  # writes but built from ./app/ark-cli/ark-cli (run ./.github/build-cli.sh first) and with paths from ${PWD}:
  # run docker compose and ark-cli from the repo root. On rootful Docker set ARK_UID, ARK_GID (id -u, id -g)
  # and DOCKER_GID (the socket's group) in .env so files it writes are yours; the defaults suit rootless engines.
  ark-scheduler:
    build:
      context: .
      dockerfile_inline: |
        FROM scratch
        COPY app/ark-cli/ark-cli /ark-cli
        ENTRYPOINT ["/ark-cli"]
        CMD ["run", "scheduler"]
    image: ark-scheduler:dev
    restart: "no"
    init: true
    stop_grace_period: 8m
    user: "${ARK_UID:-0}:${ARK_GID:-0}"
    group_add: ["${DOCKER_GID:-0}"]
    security_opt: ["label=disable"]
    working_dir: "${PWD}"
    environment:
      - "TZ=America/Los_Angeles"
      - "DOCKER_HOST=unix:///var/run/docker.sock"
      - "ARK_CONTAINER_RUNTIME=docker"
      - "PWD=${PWD}" # the scheduler reads this file too; ${PWD} must resolve the same inside
      - "HOME=${PWD}/.ark-manage"
      - "TMPDIR=${PWD}/.ark-tmp"
      - "COMPOSE_FILE=${PWD}/docker-compose.dev.yaml"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${PWD}:${PWD}"
    ports:
      - "8099:8099/tcp"
    healthcheck:
      test: ["CMD", "/ark-cli", "check", "scheduler"]
      interval: 1m
      timeout: 30s
      retries: 1
      start_period: 3m
    labels:
      ark.role: scheduler
  # A second instance in the same cluster (needs another ~12 GB of RAM):
  # asa-server-2:
  #   image: ark-server:latest
  #   container_name: ark-server-2
  #   restart: "no"
  #   init: true
  #   stop_grace_period: 8m
  #   stop_signal: SIGTERM
  #   environment:
  #     - TZ=America/Los_Angeles
  #     - MAP_NAME=ScorchedEarth_WP
  #     - SESSION_NAME=Server_2_name
  #     - SERVER_ADMIN_PASSWORD=MyPassword
  #     - SERVER_PASSWORD=
  #     - ASA_PORT=27016
  #     - NoBattlEye=true
  #     - ARK_SKIP_RAM_CHECK=1
  #   ports:
  #     - "27016:27016/udp"
  #     - "127.0.0.1:27021:27020/tcp"
  #   labels:
  #     ark.port.asa: "27016"
  #     ark.port.rcon: "27021"
  #   mem_reservation: 12G
  #   volumes:
  #     - "ark-server-2-saved:/home/ark-user/ark-server/ShooterGame/Saved"
  #     - "ark-cluster-1:/home/ark-user/ark-server/ShooterGame/Saved/clusters"
  # The web UI belongs in its own compose file: ark-cli counts every service here except the scheduler as an
  # ARK instance, so the scheduler would probe ark-web and restart it.
volumes:
  ark-server-1-saved: null
  ark-cluster-1: null
  # ark-server-2-saved: null
