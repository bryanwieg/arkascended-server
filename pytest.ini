[pytest]
addopts = -ra
pythonpath = tests
timeout = 1200
timeout_method = signal
markers =
    unit: fast tests that do not require a container runtime or network access
    container: integration tests that require a container runtime (Docker/Podman)
    fast: integration tests that run quickly without a running ARK server
    slow: integration tests that require a running ARK server container
    lite: container test that runs on the lite image (real runtime scripts, fake ARK server; tests/helpers/lite_image.py)
    podman: integration tests that verify Podman compatibility
    sdk_backend: test runs against the SDK backend (ARK_SDK_BACKEND=1)
