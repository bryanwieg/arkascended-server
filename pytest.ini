[pytest]
addopts = -ra
pythonpath = tests
timeout = 1200
timeout_method = signal
markers =
    unit: fast tests that do not require a container runtime or network access
    container: integration tests that require a container runtime (Docker/Podman)
    lite: container test that always runs on the lite image (real runtime scripts, fake ARK server; tests/helpers/lite_image.py)
    real_server: container test that checks the real ARK server; skipped in lite mode (ARK_TEST_LITE=1)
    podman: integration tests that verify Podman compatibility
